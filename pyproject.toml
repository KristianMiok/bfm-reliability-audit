[project]
name = "bfm-reliability-audit"
version = "0.1.0"
description = "Reliability audit of the BioAnalyst biodiversity foundation model"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
model = [
    "torch>=2.1",
    "timm>=0.9",
    "safetensors>=0.4",
]
dev = ["pytest>=7.4", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
